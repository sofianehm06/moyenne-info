Name: Moyenne Info
Summary: Calculateur de moyenne pour les étudiants en informatique
Description: |
  Moyenne Info aide les étudiants en informatique à calculer
  leurs moyennes universitaires.

  L'application propose le calcul des moyennes des modules
  en tenant compte des coefficients et des notes.

  Elle fonctionne hors ligne et conserve les données localement.
  Elle ne contient pas de publicité ni de suivi des utilisateurs.

